<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Signal</title>
</head>
<body>

  <h1>AVIATOR SIGNAL</h1>
  <p id="signal">Waiting for signal...</p>

<button onclick="generateSignal()">GET SIGNAL</button>

  <script>
    function generateSignal() {
      const signal = (Math.random() * 10 + 1).toFixed(2);
      document.getElementById("signal").innerHTML =
        "NEXT SIGNAL: " + signal + "x";
    }
  </script>

</body>
</html>
