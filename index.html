<body>
  <div class="container">
    <h1>Aviator Signal</h1>

    <div class="card">
      <p>Demo signal generator</p>
      <div class="signal" id="signal">READY</div>
      <button onclick="generateSignal()">GENERATE SIGNAL</button>
    </div>
  </div>

  <script>
    function generateSignal() {
      const value = (Math.random() * 5 + 1).toFixed(2);
      document.getElementById("signal").innerText = value + "x";
    }
  </script>
