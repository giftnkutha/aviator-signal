<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Live Logger</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #b71f3d;
  color: white;
}

header {
  background: white;
  color: #b71f3d;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

.menu {
  font-size: 32px;
  background: #c7354d;
  color: white;
  padding: 8px 16px;
  border-radius: 10px;
}

.hero {
  text-align: center;
  padding: 35px 20px 70px;
  min-height: 100vh;
}

.download {
  background: white;
  color: #b72b43;
  border: none;
  padding: 18px 55px;
  font-size: 25px;
  font-weight: bold;
  border-radius: 0 0 40px 40px;
  margin-bottom: 60px;
}

.phone {
  width: 320px;
  max-width: 90%;
  margin: auto;
  background: #151515;
  border: 8px solid #111;
  border-radius: 45px;
  padding: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,.5);
}

.screen {
  background: #f5f5f5;
  color: #222;
  min-height: 560px;
  border-radius: 32px;
  overflow: hidden;
}

.screen-header {
  background: linear-gradient(135deg, #e42d2d, #ff5144);
  color: white;
  padding: 30px 15px;
  font-size: 25px;
  font-weight: bold;
}

.logo {
  font-size: 42px;
  margin-bottom: 10px;
}

.signal-card {
  margin: 30px 20px;
  background: white;
  border-radius: 25px;
  padding: 25px 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

.signal-circle {
  width: 160px;
  height: 160px;
  margin: auto;
  border: 12px solid #bfe4ce;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.signal-circle strong {
  font-size: 42px;
}

.signal-circle span {
  font-size: 12px;
  color: #777;
}

.next-btn {
  margin-top: 25px;
  width: 100%;
  background: #f13e32;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
}

.log-box {
  background: #202020;
  color: white;
  margin: 20px;
  padding: 20px;
  border-radius: 18px;
}

.connected {
  color: #65d28c;
  font-size: 14px;
}

.details {
  padding: 60px 20px;
  text-align: center;
}

.details h2 {
  font-size: 50px;
  margin-bottom: 15px;
}

.details p {
  font-size: 20px;
  margin: 0;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 24px;
  }

  .details h2 {
    font-size: 38px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Aviator Live Logger</h1>
  <div class="menu">☰</div>
</header>

<section class="hero">

  <button class="download">DOWNLOAD</button>

  <div class="phone">
    <div class="screen">

      <div class="screen-header">
        <div class="logo">✈</div>
        AVIATOR LIVE LOGGER
      </div>

      <div class="signal-card">
        <div class="signal-circle">
          <strong id="signal">--.--x</strong>
          <span>Logged value</span>
        </div>

        <button class="next-btn" onclick="showDemo()">
          REFRESH LOG
        </button>
      </div>

      <div class="log-box">
        <div class="connected">● Logger Ready</div>
        <p id="log">Waiting for your authorized data source...</p>
      </div>

    </div>
  </div>

</section>

<section class="details">
  <h2>Reliable Logging</h2>
  <p>Your own dashboard for displaying authorized account and event data.</p>
</section>

<script>
function showDemo() {
  document.getElementById("signal").textContent = "--.--x";
  document.getElementById("log").textContent =
    "Demo refresh complete. Connect an authorized data source for real logged events.";
}
</script>

</body>
</html>
